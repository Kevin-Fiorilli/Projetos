<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu primeiro comando js </title>
    <style>
        body {
            background-color: rgb(117, 183, 240);
            color: white;
            font-family: monospace;
        }
    </style>
</head>
<body> 
      <h1>Olá, mundo!</h1>
      <p>Meu Primeiro Programa do JS </p>
      <script>
        window.alert('Minha primeira mensagem!') // esta me dando um alerta de mensagem 
        window.confirm('Está gostando de JS ')  // aqui ele esta perguntado se eu estou gostando de js 
        window.prompt('Qual é seu nome')  // aqui ele esta perguntando meu nome 
        window.prompt('Qual sua idade')  // aqui ele esta perguntando minha idade 
      </script>
</body>
</html>
