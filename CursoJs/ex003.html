<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu primeiro comando js </title>
    <style>
        body {
            background-color: rgb(117, 183, 240);
            color: white;
            font-family: monospace;
        }
    </style>
</head>
<body> 
      <h1>Olá, mundo!</h1>
      <p>Meu Primeiro Programa do JS </p>
      <script>
        var n1 = Number(window.prompt('Digite um número: ')) // string
        var n2 = Number(window.prompt('Digite Outro número: ')) // string
        var s = n1 + n2 
    window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) // Concatenação 
      // (number) + (number) para adicição 
      // (string) + (string) para concatenação 
      </script>
</body>
</html>
