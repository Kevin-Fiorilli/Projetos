<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>cadastro</title>
</head>
<body>
       <main id="login">
            <h1>Criar conta </h1>
            <p>Prencher com seus dados</p>

            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome">

                <label for="E-mail">E-mail</label>
                <input type="text" id="email" name="email" placeholder="Digite seu e-mail">

                <label for="senha">senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

                <label for="senha">confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Digite novamente">

                <button type="submit">Cadastrar</button>
            </form>

            <p>Já tem uma conta ? <a href="login.html">Entar</a></p>
       </main>
</body>
</html>
