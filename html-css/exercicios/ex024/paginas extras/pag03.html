<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pag 03 teste</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    background-color: #d1cdcd;
}

.login {
    width: 350px;
    margin: 100px auto;
    padding: 30px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px #00000030;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login > p  {
    text-align: center;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
}

input {
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 5px;
    background-color: #0066cc;
}
    </style>
</head>
<body>
         <main id="login">
            <h1>Criar conta </h1>
            <p>Prencher com seus dados</p>

            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome">

                <label for="E-mail">E-mail</label>
                <input type="text" id="email" name="email" placeholder="Digite seu e-mail">

                <label for="senha">senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

                <label for="senha">confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Digite novamente">

                <button type="submit">Cadastrar</button>
            </form>

            <p>Já tem uma conta ? <a href="login.html">Entar</a></p>
       </main>
</body>
</html>
