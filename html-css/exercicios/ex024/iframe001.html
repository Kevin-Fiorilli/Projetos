<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title> 
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px dashed black
        }
    </style>
</head>
<body>
    <!-- Tamanho padrão 300x150 -->
        <h1>Testando o uso de iframe</h1>
        <p>Acessando o site do <iframe src="https://www.cursoemvideo.com/" frameborder="1" height="500" width="500" scolling="yes"></iframe> para aprender a programar</p>

     <p>
        O intagram e muito bom 

        <iframe src="https://www.instagram.com/" frameborder="0"></iframe>
        <a href="https://www.instagram.com/"> Instagram</a>
     </p>
</body>
</html>
