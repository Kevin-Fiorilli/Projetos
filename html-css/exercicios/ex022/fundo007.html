<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            
            position: relative;
            height: 96vh;
            padding: 10px;
            background-color: brown;
        }

        #conteudo {
            background-image: url(imagens/target001.png);
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: chocolate;
            
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);  /* o primeiro pixel mexe para o lado dereito se for positivo e se for negativo mexe para o lado esquerdo , o segundo pixel se for positivo vai para baixo e se for negativo vai para cima */
        }
    </style>
</head>
<body>
      <section id="container">    <!--- a tag SECTION Agrupamento temático de conteúdo-->
            <article id="conteudo">

            </article>
      </section> 
</body>
</html>
