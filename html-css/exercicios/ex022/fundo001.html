<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesste de Imagem de Fudno</title>
    <style>

      body {
        background-image: url(imagens/wallpaper004.jpg);
      }

        div.quadrado {
            display: inline-block;
            border: 1px solid black;
            border-radius: 10px;
            background-color: lightpink;
            width: 300px;
            height: 300px;
        }
          
        div#b1 {
         background-color: rgb(127, 236, 255);
        }

        div#b2 {
            background-image: linear-gradient(to bottom, rgb(0, 53, 128), rgb(42, 2, 68));
        }

        div#b3 {
          background-image: url(imagens/pattern001.png);
        }

        div#b4 {
            background-image: url(imagens/pattern002.png);
        }

        div#b5 {
            background-image: url(imagens/pattern003.png);
        }
    </style>
</head>
<body>
     <div class="quadrado" id="b1">

     </div>
     <div class="quadrado" id="b2">

     </div>
     <div class="quadrado" id="b3">

     </div>
     <div class="quadrado" id="b4">

     </div>
     <div class="quadrado" id="b5">

     </div>
</body>
</html>
